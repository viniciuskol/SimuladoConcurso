<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Estudo — Transpetro 2026</title>
<link rel="stylesheet" href="shared/styles.css">
</head>
<body>
<div class="topbar">
  <a href="simulado.html">Simulado TRANSPETRO</a>
  <nav>
    <a href="simulado.html">Simulado</a>
    <a href="estudo.html" class="active">Estudo</a>
  </nav>
</div>
<div class="app" id="app">
  <div class="empty-state">Carregando...</div>
</div>
<script type="module">
import { loadJSON, showFetchHelp } from "./shared/data-loader.js";
import { dueCards, rateCard, statsByArea, srsSummary, wrongByArea } from "./shared/storage.js";

const app = document.getElementById("app");
let AREAS = [], CARDS = [], QCOUNT = {}, CONTENT = {}, PLAN = null, QBYID = {};

// Escapa também " e ' porque o mesmo esc() é usado em valor de ATRIBUTO, onde
// escapar só &<> deixa quebrar o atributo. Em texto, &quot;/&#39; renderizam como "/'.
const esc = s => String(s ?? "").replace(/[&<>"']/g, c =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

async function init() {
  try {
    AREAS = (await loadJSON("data/areas.json")).areas;
    CARDS = (await loadJSON("data/flashcards.json")).cards || [];
  } catch (e) {
    showFetchHelp(app);
    return;
  }
  try { PLAN = await loadJSON("data/plan.json"); } catch { /* plano é opcional */ }
  try {
    const qs = (await loadJSON("data/questions.json")).questions || [];
    // Mesmo carregamento serve à contagem por área e à tela de erros (índice por id).
    for (const q of qs) { QCOUNT[q.area] = (QCOUNT[q.area] || 0) + 1; QBYID[q.id] = q; }
  } catch { /* contagem é opcional */ }
  renderHome();
}

async function loadAreaContent(areaId) {
  if (areaId in CONTENT) return CONTENT[areaId];
  try { CONTENT[areaId] = await loadJSON(`data/content/${areaId}.json`); }
  catch { CONTENT[areaId] = null; }
  return CONTENT[areaId];
}

function cardsOf(areaId) { return CARDS.filter(c => c.area === areaId); }

function areaLabelOf(id) { return (AREAS.find(a => a.id === id) || {}).label || id; }

/* Visão de erros: o agregado do storage, cruzado com as questões carregadas.
   Erro cujo questionId não existe mais em questions.json é ignorado em silêncio
   (a prova pode ter sido reindexada) — e grupo que fica vazio desaparece. */
function errorView() {
  const raw = wrongByArea();
  // A área confiável é a da questão em questions.json, não a que ficou gravada na
  // tentativa: o histórico pode ser antigo, de outra taxonomia, ou editado à mão.
  const items = raw.groups
    .flatMap(g => g.items)
    .filter(it => QBYID[it.questionId])
    .map(it => ({ ...it, area: QBYID[it.questionId].area }));
  const byArea = new Map();
  for (const it of items) {
    if (!byArea.has(it.area)) byArea.set(it.area, []);
    byArea.get(it.area).push(it);
  }
  const groups = [...byArea.entries()]
    .map(([area, list]) => ({ area, items: list.sort((x, y) => y.lastWrong - x.lastWrong) }))
    .sort((x, y) => y.items.length - x.items.length || areaLabelOf(x.area).localeCompare(areaLabelOf(y.area)));
  return {
    groups,
    attempts: raw.attempts,
    attemptsShown: items.reduce((t, it) => t + it.wrong, 0),
    wrongTotal: items.length,
    recovered: items.filter(it => it.recovered).length
  };
}

/* ---------- Home ---------- */

function renderHome() {
  const due = dueCards(CARDS);
  const stats = Object.fromEntries(statsByArea(AREAS).map(s => [s.id, s]));
  const srs = srsSummary(CARDS);
  const err = errorView();

  const areaRow = (a, i) => {
    const nq = QCOUNT[a.id] || 0;
    const nc = cardsOf(a.id).length;
    const st = stats[a.id];
    const acc = st && st.total ? `${st.pct}% no simulado` : "sem tentativas";
    return `<button class="btn area-row" data-i="${i}">
      <span class="alt-key">${a.num ?? "•"}</span>
      <span class="alt-text">
        <strong>${esc(a.label)}</strong>
        <span class="muted block">${nq} questões · ${nc} cards · ${acc}</span>
      </span>
    </button>`;
  };

  app.innerHTML = `
    <h1>Área de estudo</h1>
    <div class="card">
      <h2>Revisão espaçada</h2>
      <p class="muted">${due.length} card(s) para hoje · ${CARDS.length} no total · ${srs.seen} já vistos.</p>
      ${due.length
        ? `<button class="btn primary" id="review-all">Revisar agora (misturando áreas)</button>
           <p class="muted">Intercalação: misturar áreas na mesma sessão fixa mais do que estudar em bloco.</p>`
        : `<p class="muted">Nada devido agora. ${CARDS.length ? "Volte amanhã — ou entre numa área e revise à força." : ""}</p>`}
    </div>
    <div class="card">
      <h2>Revisar meus erros</h2>
      ${err.attempts
        ? `<p class="muted">${err.wrongTotal} questão(ões) distinta(s) errada(s) em ${err.groups.length} área(s), de ${err.attempts} tentativa(s) no histórico total.</p>
           <p class="muted">${err.recovered} dela(s) você já acertou numa tentativa posterior — acertar depois de errar é o sinal que interessa.</p>
           ${err.wrongTotal
             ? `<button class="btn primary" id="open-errors">Abrir revisão dos erros</button>`
             : `<p class="muted">Nenhum erro pendente no histórico. Faça mais um simulado para ter material de revisão.</p>`}`
        : `<p class="muted">Sem tentativas registradas ainda: faça um <a href="simulado.html">simulado</a> primeiro e os erros aparecem aqui, agrupados por área.</p>`}
    </div>
    ${PLAN ? `<div class="card accent">
      <h2>Plano até a prova</h2>
      <p class="muted">${daysToExam()} dias para 29/11/2026.${currentBlock() ? ` Bloco atual: <strong>${esc(currentBlock().label)}</strong> (${esc(currentBlock().weeks)}).` : ""}</p>
      <button class="btn primary" id="open-plan">Abrir o plano</button>
    </div>` : ""}
    <div class="card">
      <h2>Onde estudar primeiro</h2>
      <p class="muted">Prioridade = peso histórico da área × o quanto você ainda erra nela. Áreas sem tentativa no simulado entram como "não medido" e ficam no fim da lista, não porque sejam fáceis, mas porque ainda não há dado.</p>
      <div id="priority"></div>
      <p class="muted">O edital fixa 50 questões de Conhecimentos Específicos nas 8 áreas e 10 de Português + 10 de Inglês, mas não publica quantas caem por área técnica. O peso aqui é a fatia de cada área nas provas antigas — proxy, não garantia.</p>
    </div>
    <div class="card">
      <h2>Conteúdo por área</h2>
      <div class="alt-list">${AREAS.map(areaRow).join("")}</div>
    </div>
    <div class="card">
      <h2>Como usar</h2>
      <ul class="tight">
        <li><strong>Leia o resumo</strong> da área uma vez, sem tentar memorizar.</li>
        <li><strong>Vá para os flashcards</strong> e tente responder <em>antes</em> de revelar — o esforço de lembrar é o que fixa.</li>
        <li><strong>Erre no simulado</strong> e volte para a área do erro: é o ciclo mais rápido de aprendizado.</li>
        <li><strong>Padrões da banca</strong> e <strong>palavras-armadilha</strong> de cada área valem mais que releitura do resumo.</li>
      </ul>
    </div>
  `;
  renderPriority(stats);
  const pb = document.getElementById("open-plan");
  if (pb) pb.addEventListener("click", renderPlan);
  const rb = document.getElementById("review-all");
  if (rb) rb.addEventListener("click", () => startReview(shuffle(due), "Revisão geral"));
  const eb = document.getElementById("open-errors");
  if (eb) eb.addEventListener("click", renderErrors);
  // O id da área vai pelo closure, não por atributo: nada de dado no HTML.
  app.querySelectorAll("[data-i]").forEach(b =>
    b.addEventListener("click", () => renderArea(AREAS[Number(b.dataset.i)].id)));
}

function daysToExam() {
  const ms = new Date(PLAN.examDate + "T00:00:00") - new Date();
  return Math.max(0, Math.ceil(ms / 86400000));
}

// O bloco corrente sai do intervalo "dd/mm a dd/mm" impresso em `weeks`.
// Sem match, nenhum bloco é destacado — melhor não destacar que destacar errado.
function currentBlock() {
  if (!PLAN) return null;
  const y = new Date(PLAN.examDate).getFullYear();
  const now = new Date();
  for (const b of PLAN.blocks) {
    const m = /(\d{2})\/(\d{2})\s*a\s*(\d{2})\/(\d{2})/.exec(b.weeks || "");
    if (!m) continue;
    const ini = new Date(y, +m[2] - 1, +m[1]);
    const fim = new Date(y, +m[4] - 1, +m[3], 23, 59, 59);
    if (now >= ini && now <= fim) return b;
  }
  return null;
}

function renderPlan() {
  const cur = currentBlock();
  const areaLabel = id => (AREAS.find(a => a.id === id) || {}).label || id;
  app.innerHTML = `
    <button class="btn" id="back">← Voltar</button>
    <h1>Plano até 29/11/2026</h1>
    <div class="card"><p class="muted">${esc(PLAN.sourceNote || "")}</p></div>
    ${PLAN.blocks.map(b => `
      <div class="card ${cur && cur.n === b.n ? "accent" : ""}">
        <h2>${esc(b.label)}</h2>
        <p class="muted">${esc(b.weeks)}${cur && cur.n === b.n ? " · agora" : ""} · ${(b.focus || []).map(f => esc(areaLabel(f))).join(", ")}</p>
        <p>${esc(b.goal || "")}</p>
        <ul class="tight">${(b.checklist || []).map(i => `<li>${esc(i)}</li>`).join("")}</ul>
      </div>`).join("")}
    <div class="card">
      <h2>🎯 O que a banca repete entre áreas</h2>
      ${(PLAN.crossPatterns || []).map(p => `<div class="sub">
        <strong>${esc(p.title)}</strong><p>${esc(p.body)}</p>
        ${(p.evidence || []).length ? `<p class="muted">Visto em: ${p.evidence.map(e => esc(e)).join(", ")}</p>` : ""}
      </div>`).join("")}
    </div>
    <div class="card">
      <h2>⏱ No dia da prova</h2>
      ${(PLAN.examDay || []).map(e => `<div class="sub"><strong>${esc(e.title)}</strong><p>${esc(e.body)}</p></div>`).join("")}
    </div>`;
  document.getElementById("back").addEventListener("click", renderHome);
}

function renderPriority(stats) {
  const box = document.getElementById("priority");
  if (!box) return;
  const totalQ = Object.values(QCOUNT).reduce((a, b) => a + b, 0) || 1;
  const rows = AREAS.map(a => {
    const weight = (QCOUNT[a.id] || 0) / totalQ;      // fatia histórica da área
    const st = stats[a.id];
    const measured = !!(st && st.total);
    const errRate = measured ? 1 - st.correct / st.total : null;
    // Sem medição, usa 0.5 só para ordenar — e a linha é rotulada como não medida.
    const score = weight * (measured ? errRate : 0.5);
    return { a, weight, measured, pct: measured ? st.pct : null, score };
  }).sort((x, y) => y.score - x.score);

  const max = Math.max(...rows.map(r => r.score), 0.0001);
  box.innerHTML = rows.map(r => `
    <div class="area-bar">
      <span class="prio-label">${esc(r.a.label)}</span>
      <span class="track"><div style="width:${Math.round((r.score / max) * 100)}%"></div></span>
      <span class="pct">${r.measured ? `${100 - r.pct}% erro` : "—"}</span>
    </div>`).join("");
}

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}

/* ---------- Revisar meus erros ---------- */

// O `stem` vem de arquivo local, mas aqui ele é cortado em ~140 caracteres:
// truncar HTML no meio geraria markup quebrado, então tiro as tags e escapo o
// texto — assim nenhum `<script>` sobrevive nem por acidente.
function trunc(s, n = 140) {
  const t = String(s ?? "").replace(/<[^>]*>/g, " ").replace(/\s+/g, " ").trim();
  return esc(t.length > n ? t.slice(0, n).replace(/\s+\S*$/, "") + "…" : t);
}

function fmtDate(ts) {
  if (!ts) return "";
  const d = new Date(ts);
  return isNaN(d) ? "" : d.toLocaleDateString("pt-BR");
}

function renderErrors() {
  const err = errorView();
  const max = Math.max(...err.groups.map(g => g.items.length), 1);

  const group = (g, i) => {
    const nc = cardsOf(g.area).length;
    const rec = g.items.filter(it => it.recovered).length;
    return `<div class="card">
      <h2>${esc(areaLabelOf(g.area))}</h2>
      <p class="muted">${g.items.length} questão(ões) errada(s)${rec ? ` · ${rec} já recuperada(s) depois` : ""}</p>
      <div class="area-bar">
        <span class="track"><div style="width:${Math.round((g.items.length / max) * 100)}%"></div></span>
        <span class="pct">${g.items.length}</span>
      </div>
      <div class="alt-list">
        <button class="btn" data-sum="${i}">📘 Ver o resumo da área</button>
        ${nc ? `<button class="btn" data-fc="${i}">🃏 Revisar os ${nc} flashcards desta área</button>`
             : `<p class="muted">Sem flashcards nesta área ainda.</p>`}
      </div>
      <details class="explain">
        <summary>${g.items.length === 1 ? "Ver a questão que errei" : `Ver as ${g.items.length} questões que errei`}</summary>
        ${g.items.map(it => {
          const q = QBYID[it.questionId];
          return `<div class="sub">
            <strong>Questão ${esc(it.questionId)}</strong>
            <span class="muted">${it.wrong > 1 ? ` · errada ${it.wrong}×` : ""}${it.lastWrong ? ` · último erro ${esc(fmtDate(it.lastWrong))}` : ""}${it.recovered ? " · acertada depois ✓" : ""}</span>
            ${q.subtopic ? `<span class="muted block">${esc(q.subtopic)}</span>` : ""}
            <p>${trunc(q.stem)}</p>
          </div>`;
        }).join("")}
      </details>
    </div>`;
  };

  app.innerHTML = `
    <button class="btn" id="back">← Voltar</button>
    <h1>Revisar meus erros</h1>
    <div class="card">
      <p class="muted">${err.wrongTotal} questão(ões) distinta(s) errada(s) · ${err.attemptsShown} erro(s) somando as repetições · ${err.recovered} já acertada(s) numa tentativa posterior</p>
      <p class="muted">Áreas em ordem: quem mais te derruba primeiro. Dentro de cada área, o erro mais recente vem primeiro.</p>
    </div>
    ${err.groups.length
      ? err.groups.map(group).join("")
      : `<div class="card"><p class="muted">Nenhum erro registrado. Faça um <a href="simulado.html">simulado</a> e volte aqui.</p></div>`}
  `;
  document.getElementById("back").addEventListener("click", renderHome);
  // Só o índice do grupo trafega por atributo; o id da área vem do closure.
  app.querySelectorAll("[data-sum]").forEach(b => {
    const area = err.groups[Number(b.dataset.sum)].area;
    b.addEventListener("click", () => renderArea(area, renderErrors));
  });
  // Sessão forçada: usa todos os cards da área, mesmo que nenhum esteja devido hoje.
  app.querySelectorAll("[data-fc]").forEach(b => {
    const area = err.groups[Number(b.dataset.fc)].area;
    b.addEventListener("click", () => startReview(
      shuffle(cardsOf(area)), `${areaLabelOf(area)} — erros`, renderErrors));
  });
}

/* ---------- Área ---------- */

async function renderArea(areaId, onBack = renderHome) {
  // Id de área desconhecido (histórico antigo) não pode congelar a tela.
  const area = AREAS.find(a => a.id === areaId) || { id: areaId, label: areaId, topics: [] };
  const content = await loadAreaContent(areaId);
  const cards = cardsOf(areaId);
  const due = dueCards(cards);

  const sections = [];
  if (content) {
    if (content.resumo) sections.push(sec("Resumo", content.resumo));
    for (const c of content.cheatsheet || [])
      sections.push(sec(`📌 ${esc(c.heading)}`, `<ul class="tight">${(c.items || []).map(i => `<li>${i}</li>`).join("")}</ul>`));
    for (const m of content.mentalModels || [])
      sections.push(sec(`🧠 ${esc(m.title)}`, `<p>${m.body}</p>`, "accent"));
    if ((content.patterns || []).length)
      sections.push(sec("🎯 Padrões da banca nesta área",
        (content.patterns).map(p => `<div class="sub">
            <strong>${esc(p.title)}</strong>
            <p>${p.howToSpot || ""}</p>
            ${(p.evidence || []).length ? `<p class="muted">Visto em: ${p.evidence.map(e => esc(e)).join(", ")}</p>` : ""}
          </div>`).join("")));
    if ((content.tactics || []).length)
      sections.push(sec("⏱ Táticas de prova",
        (content.tactics).map(t => `<div class="sub"><strong>${esc(t.title)}</strong><p>${t.body || ""}</p></div>`).join("")));
    if ((content.resources || []).length)
      sections.push(sec("📚 Material de apoio",
        `<p class="muted">Links verificados um por um (HTTP 200 e conferência do conteúdo). Fonte oficial primeiro; o que é pago está marcado.</p>
         <div class="alt-list">${content.resources.map(r => `
          <a class="btn res" href="${encodeURI(r.url)}" target="_blank" rel="noopener noreferrer">
            <span class="alt-text">
              <strong>${esc(r.title)}</strong>
              <span class="muted block">${esc(r.publisher)} · ${esc(r.kind)}${r.free ? "" : " · pago"}</span>
              <span class="muted block">${esc(r.why)}</span>
            </span>
          </a>`).join("")}</div>`));
    if ((content.trapWords || []).length)
      sections.push(sec("⚠ Palavras-armadilha",
        `<div class="trap-list">${content.trapWords.map(t => `<div class="sub">
            <strong>${esc(t.term)}</strong> <span class="muted">× ${esc(t.confusedWith)}</span>
            <p>${t.distinction || ""}</p></div>`).join("")}</div>`));
  }

  app.innerHTML = `
    <button class="btn" id="back">← Voltar</button>
    <h1>${esc(area.label)}</h1>
    <div class="card">
      <p class="muted">${QCOUNT[areaId] || 0} questões reais no banco · ${cards.length} flashcards (${due.length} devidos)</p>
      ${cards.length ? `<button class="btn primary" id="rev-area">Flashcards desta área</button>` : ""}
      <details class="explain"><summary>Subtópicos do edital (Anexo IV)</summary>
        <ul class="tight">${(area.topics || []).map(t => `<li>${esc(t)}</li>`).join("")}</ul>
      </details>
    </div>
    ${content ? sections.join("") : `<div class="empty-state">Conteúdo de estudo desta área ainda não foi escrito.</div>`}
  `;
  document.getElementById("back").addEventListener("click", onBack);
  const rb = document.getElementById("rev-area");
  if (rb) rb.addEventListener("click", () =>
    startReview(shuffle(due.length ? due : cards), area.label, () => renderArea(areaId, onBack)));
}

function sec(title, html, cls = "") {
  return `<div class="card ${cls}"><h2>${title}</h2>${html}</div>`;
}

/* ---------- Flashcards ---------- */

function startReview(queue, label, onDone) {
  const done = onDone || renderHome;
  if (!queue.length) { done(); return; }
  let idx = 0;
  const areaLabel = id => (AREAS.find(a => a.id === id) || {}).label || id;

  const showCard = () => {
    if (idx >= queue.length) {
      app.innerHTML = `<div class="card"><h2>Sessão concluída</h2>
        <p class="muted">${queue.length} card(s) revisado(s) — ${esc(label)}.</p>
        <button class="btn primary" id="home">Voltar</button></div>`;
      document.getElementById("home").addEventListener("click", done);
      return;
    }
    const c = queue[idx];
    app.innerHTML = `
      <button class="btn" id="quit">← Sair da sessão</button>
      <div class="progressbar"><div style="width:${(idx / queue.length) * 100}%"></div></div>
      <div class="card">
        <p class="muted">Card ${idx + 1} de ${queue.length} · ${esc(areaLabel(c.area))}</p>
        <h2>${c.front}</h2>
      </div>
      <button class="btn primary" id="reveal">Mostrar resposta</button>
      <p class="muted">Tente formular a resposta em voz alta antes de revelar.</p>`;
    document.getElementById("reveal").addEventListener("click", reveal);
    document.getElementById("quit").addEventListener("click", done);
  };

  const reveal = () => {
    const c = queue[idx];
    app.innerHTML = `
      <button class="btn" id="quit">← Sair da sessão</button>
      <div class="progressbar"><div style="width:${(idx / queue.length) * 100}%"></div></div>
      <div class="card">
        <p class="muted">${esc(areaLabel(c.area))}</p>
        <h2>${c.front}</h2>
        <div class="answer">${c.back}</div>
        ${c.sourceQuestionId ? `<p class="muted">Origem: questão ${esc(c.sourceQuestionId)}</p>` : ""}
      </div>
      <div class="alt-list rate-row">
        <button class="btn" data-r="1">Errei</button>
        <button class="btn" data-r="2">Difícil</button>
        <button class="btn" data-r="3">Bom</button>
        <button class="btn" data-r="4">Fácil</button>
      </div>`;
    document.getElementById("quit").addEventListener("click", done);
    app.querySelectorAll("[data-r]").forEach(b => b.addEventListener("click", () => {
      rateCard(c.id, Number(b.dataset.r));
      idx += 1;
      showCard();
    }));
  };

  showCard();
}

init();
</script>
</body>
</html>
