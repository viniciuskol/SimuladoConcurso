<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Estudo — Transpetro 2026</title>
<link rel="stylesheet" href="shared/styles.css">
</head>
<body>
<div class="topbar">
  <a href="simulado.html">Simulado TRANSPETRO</a>
  <nav>
    <a href="simulado.html">Simulado</a>
    <a href="estudo.html" class="active">Estudo</a>
  </nav>
</div>
<div class="app" id="app">
  <div class="empty-state">Carregando...</div>
</div>
<script type="module">
import { loadJSON, showFetchHelp } from "./shared/data-loader.js";
import { dueCards, rateCard } from "./shared/storage.js";

const app = document.getElementById("app");
let AREAS = [], CARDS = [], CONTENT = {};

async function init() {
  try {
    AREAS = (await loadJSON("data/areas.json")).areas;
    CARDS = (await loadJSON("data/flashcards.json")).cards;
  } catch (e) {
    showFetchHelp(app);
    return;
  }
  renderHome();
}

async function loadAreaContent(areaId) {
  if (CONTENT[areaId]) return CONTENT[areaId];
  try {
    CONTENT[areaId] = await loadJSON(`data/content/${areaId}.json`);
  } catch {
    CONTENT[areaId] = null;
  }
  return CONTENT[areaId];
}

function renderHome() {
  const due = dueCards(CARDS);
  app.innerHTML = `
    <h1>Área de estudo</h1>
    <div class="card">
      <h2>Revisão de flashcards</h2>
      <p class="muted">${due.length} card(s) devido(s) hoje, de ${CARDS.length} no total.</p>
      ${due.length ? `<button class="btn primary" id="review">Revisar agora</button>` : `<p class="muted">Nada pendente agora.</p>`}
    </div>
    <div class="card">
      <h2>Conteúdo por área</h2>
      ${AREAS.map(a => `<button class="btn" data-area="${a.id}">${a.label}</button>`).join("")}
    </div>
  `;
  const reviewBtn = document.getElementById("review");
  if (reviewBtn) reviewBtn.addEventListener("click", () => startReview(due));
  app.querySelectorAll("[data-area]").forEach(btn =>
    btn.addEventListener("click", () => renderArea(btn.dataset.area)));
}

async function renderArea(areaId) {
  const area = AREAS.find(a => a.id === areaId);
  const content = await loadAreaContent(areaId);
  app.innerHTML = `
    <button class="btn" id="back">← Voltar</button>
    <h1>${area.label}</h1>
    ${!content ? `<div class="empty-state">Conteúdo de estudo desta área ainda não foi escrito. Volte em breve.</div>` : `
      <div class="card"><h2>Resumo</h2>${content.resumo || ""}</div>
      ${(content.cheatsheet || []).map(c => `<div class="card"><h3>${c.heading}</h3><ul>${(c.items || []).map(i => `<li>${i}</li>`).join("")}</ul></div>`).join("")}
      ${(content.mentalModels || []).map(m => `<div class="card"><h3>🧠 ${m.title}</h3><p>${m.body}</p></div>`).join("")}
      ${(content.patterns || []).map(p => `<div class="card"><h3>⚠ ${p.title}</h3><p>${p.howToSpot || ""}</p></div>`).join("")}
    `}
  `;
  document.getElementById("back").addEventListener("click", renderHome);
}

function startReview(queue) {
  let idx = 0;
  const showCard = () => {
    if (idx >= queue.length) { renderHome(); return; }
    const c = queue[idx];
    app.innerHTML = `
      <div class="card">
        <p class="muted">Card ${idx + 1} de ${queue.length}</p>
        <h2>${c.front}</h2>
        <button class="btn primary" id="reveal">Mostrar resposta</button>
      </div>`;
    document.getElementById("reveal").addEventListener("click", () => {
      app.innerHTML = `
        <div class="card">
          <h2>${c.front}</h2>
          <p>${c.back}</p>
          <div style="display:flex;gap:8px">
            <button class="btn" data-r="1">Errei</button>
            <button class="btn" data-r="2">Difícil</button>
            <button class="btn" data-r="3">Bom</button>
            <button class="btn" data-r="4">Fácil</button>
          </div>
        </div>`;
      app.querySelectorAll("[data-r]").forEach(b => b.addEventListener("click", () => {
        rateCard(c.id, Number(b.dataset.r));
        idx += 1;
        showCard();
      }));
    });
  };
  showCard();
}

init();
</script>
</body>
</html>
